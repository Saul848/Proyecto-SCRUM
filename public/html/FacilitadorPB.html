<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilitador - Product Backlog</title>
  <link rel="stylesheet" href="../css/FacilitadorPB.css">
</head>
<body>

  <!-- Bloque superior -->
  <header id="BloqueSuperior">
    <div id="DivMsjFacilitador">Facilitador</div>
    <div id="DivTitulo">Product Backlog para el cliente: <span>Juan Carlos</span></div>
  </header>

  <!-- Bloque inferior -->
  <main id="BloqueInferior">
    
    <!-- Section panelLateral -->
    <section id="panelLateral">
      <div id="divIndice">
        <span id="labelSeccion">❖ Seccion</span>
        <a href="#" id="linkMiEquipo">Mi equipo</a>
        <a href="#" id="linkMensajes">Mensajes</a>
        <a href="#" id="linkProductBacklog" class="active">Product Backlog</a>
        <a href="#" id="linkSprint">Sprint</a>
        <a href="#" id="linkMisTareas">Mis tareas</a>
        <a href="#" id="linkReunirse">Reunirse</a>
        <a href="#" id="linkGraficas">Graficas</a>
        <a href="#" id="linkAjustes">Ajustes</a>
      </div>
    </section>

    <!-- Section zonaDeTrabajo -->
    <section id="zonaDeTrabajo">
      <div id="DivContPB">
        
        <!-- Encabezados de la tabla -->
        <div id="DivEncabezados">
          <label id="LabelID">ID</label>
          <label id="LabelNombreHistoria">Historias de usuario</label>
          <label id="LabelDescripccion">Descripccion</label>
          <label id="LabelCriterios">Criterios de acpetacion</label>
          <label id="LabelValor">Valor</label>
          <label id="LabelSprintAsginado">Sprint asignado</label>
          <div class="espacioAcciones"></div>
        </div>

        <!-- Contenedor con scrollbar vertical -->
        <div id="DivHistoria">
        </div> <!-- Fin de DivHistoria -->

<div id="divOpccionesInferiores">
          <!-- Botones de acciones de la parte inferior de la zona de trabajo -->
          <div id="DivBtnCompartirMaterial">
            <button id="btnCompartirMaterial">Compartir material adicional</button>
          </div>
          <div id="DivBtnAgregarHistoria">
            <button id="btnAgregarHistoria">+ Añadir nueva historia</button>
          </div>
          <div id="DivBtnModHistoria">
            <button id="btnModHistoria"># Modificar historia</button>
          </div>

          <!-- PANEL MODAL AGREGAR HISTORIAS-->
          <div id="modalAgregarHistoria" class="modal">
            <div class="modal-contenido">
              <h3>Añadir Historia de Usuario</h3>
              
              <!-- Campo 1: Título -->
              <div class="entradaInp">
                <label for="inpAddTitulo">Título de la historia:</label>
                <input type="text" id="inpAddTitulo" placeholder="Escribe el título...">
              </div>

              <!-- Campo 2: Descripción -->
              <div class="entradaTextA">
                <label for="inpAddDescripccion">Descripción:</label>
                <textarea id="inpAddDescripccion" placeholder="Escribe la descripción..."></textarea>
              </div>

              <!-- Campo 3: Criterios de aceptación -->
              <div class="entradaTextA">
                <label for="inpAddCriterios">Criterios de aceptación:</label>
                <textarea id="inpAddCriterios" placeholder="Escribe los criterios..."></textarea>
              </div>

              <!-- Campo 4: Valor -->
              <div class="entradaInp">
                <label for="inpAddValor">Valor:</label>
                <input type="number" id="inpAddValor" placeholder="0 - 4000">
              </div>

              <!-- Campo 5: Sprint asignado -->
              <div class="entradaInp">
                <label for="inpAddSprintAsig">Sprint asignado:</label>
                <input type="text" id="inpAddSprintAsig" placeholder="Ej. Sprint 1">
              </div>

              <div class="modal-botones">
                <button id="btnGuardarModal+">Guardar</button>
                <button id="btnCerrarModal+">Cancelar</button>
              </div>
            </div>
          </div>

          <!-- PANEL MODAL MODIFICAR HISTORIAS -->
          <div id="modalModificarHistoria" class="modal">
            <div class="modal-contenido">
              <h3>Modificar Historia de Usuario</h3>
              
              <!-- Campo 1: Título -->
              <div class="entradaInp">
                <label for="inpModTitulo">Cambiar título de la historia:</label>
                <input type="text" id="inpModTitulo" placeholder="Escribe el título...">
              </div>

              <!-- Campo 2: Descripción -->
              <div class="entradaTextA">
                <label for="inpModDescripccion">Cambiar descripción:</label>
                <textarea id="inpModDescripccion" placeholder="Escribe la descripción..."></textarea>
              </div>

              <!-- Campo 3: Criterios de aceptación -->
              <div class="entradaTextA">
                <label for="inpModCriterios">Cambiar criterios de aceptación:</label>
                <textarea id="inpModCriterios" placeholder="Escribe los criterios..."></textarea>
              </div>

              <!-- Campo 4: Valor -->
              <div class="entradaInp">
                <label for="inpModValor">Valor:</label>
                <input type="number" id="inpModValor" placeholder="0 - 4000">
              </div>

              <!-- Campo 5: Sprint asignado -->
              <div class="entradaInp">
                <label for="inpModSprintAsig">Sprint asignado:</label>
                <input type="text" id="inpModSprintAsig" placeholder="Ej. Sprint 1">
              </div>

              <div class="modal-botones">
                <button id="btnGuardarModal#">Modificar</button>
                <button id="btnCerrarModal#">Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
<script src="../js/FacilitadorPB.js" defer></script>
</body>
</html>
