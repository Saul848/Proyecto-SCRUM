<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrumbird - Inicio de Sesión</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="card-login">
    <!-- Panel Izquierdo: Formulario Login -->
    <div class="panel-form">
      <h2>Inicio de Sesión</h2>
      
      <form id="form-login">
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            placeholder="usuario@organizacion.com" 
            required
          >
        </div>

        <div class="campo">
          <label for="passwd">Contraseña</label>
          <input 
            type="password" 
            id="passwd" 
            name="passwd" 
            placeholder="**********" 
            required
          >
        </div>

        <button type="submit" class="btn-azul">Iniciar Sesion</button>
      </form>
    </div>

    <!-- Panel Derecho: Bienvenida / Scrummear -->
    <div class="panel-info">
      <h1>Hola, ¡Bienvenido!</h1>
      <p>Registra tus datos y comienza a Scrummear.</p>
      <button type="button" class="btn-borde" id="btn-registrarse">Registrarme</button>
    </div>
  </div>
  <!-- Modal para Crear Cuenta -->
<div id="modal-registro" class="modal" style="display: none;">
    <h2>Crear Cuenta</h2>
    <form id="form-registro">
        <div>
            <label for="reg-nombre">Nombre:</label>
            <input type="text" id="reg-nombre" required maxlength="20">
        </div>
        <div>
            <label for="reg-username">Nombre de Usuario:</label>
            <input type="text" id="reg-username" required maxlength="20">
        </div>
        <div>
            <label for="reg-email">Correo Electrónico:</label>
            <input type="email" id="reg-email" maxlength="25">
        </div>
        <div>
            <label for="reg-passwd">Contraseña:</label>
            <input type="password" id="reg-passwd" required maxlength="20">
        </div>
        <button type="submit" id="btn-enviar-registro">Registrarse</button>
        <button type="button" onclick="mostrarModal('modal-login')">Ir al Login</button>
    </form>
</div>

  <script src="../js/login.js"></script>
</body>
</html>
