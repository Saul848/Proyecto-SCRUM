<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrumbird - Autenticación</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="contenedor" id="contenedor">
    
    <!-- Lado Formulario: Registro de cuenta (Modo Registro) -->
    <div class="form-container registro-container">
      <form id="form-registro">
        <h2>Registro de cuenta</h2>

        <!-- 1. Nombre -->
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" placeholder="Tu nombre" required maxlength="20">

        <!-- 2. Nombre de usuario -->
        <label for="reg-username">Nombre de usuario</label>
        <input type="text" id="reg-username" placeholder="ej. usuario123" required maxlength="20">

        <!-- 3. Correo electrónico -->
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="usuario@organizacion.com" required maxlength="25">

        <!-- 4. Contraseña -->
        <label for="reg-passwd">Contraseña</label>
        <input type="password" id="reg-passwd" placeholder="**********" required maxlength="20">

        <button type="submit" class="btn-azul">Registrarme</button>
      </form>
    </div>

    <!-- Lado Formulario: Inicio de Sesión (Modo Login) -->
    <div class="form-container login-container">
      <form id="form-login">
        <h2>Inicio de Sesión</h2>

        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="usuario@organizacion.com" required>

        <label for="login-passwd">Contraseña</label>
        <input type="password" id="login-passwd" placeholder="**********" required>

        <button type="submit" class="btn-azul">Iniciar Sesion</button>
      </form>
    </div>

    <!-- Paneles Azules Deslizantes (Overlay) -->
    <div class="overlay-container">
      <div class="overlay">
        <!-- Panel Azul cuando estás en Registro (muestra botón para regresar a Login) -->
        <div class="overlay-panel overlay-izq">
          <h1>¡Hola de nuevo!</h1>
          <p>Ya tienes una cuenta, inicia sesión y continua Scrummeando</p>
          <button type="button" class="btn-borde" id="btn-ir-login">Iniciar sesion</button>
        </div>

        <!-- Panel Azul cuando estás en Login (muestra botón para ir a Registro) -->
        <div class="overlay-panel overlay-der">
          <h1>Hola, ¡Bienvenido!</h1>
          <p>Registra tus datos y comienza a Scrummear.</p>
          <button type="button" class="btn-borde" id="btn-ir-registro">Registrarme</button>
        </div>
      </div>
    </div>

  </div>

  <script src="../js/login.js"></script>
</body>
</html>
