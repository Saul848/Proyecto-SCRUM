<!-- Modal para Crear Cuenta -->
<div id="modal-registro" class="modal" style="display: none;">
    <h2>Crear Cuenta</h2>
    <form id="form-registro">
        <div>
            <label for="reg-nombre">Nombre:</label>
            <input type="text" id="reg-nombre" required maxlength="20">
        </div>
        <div>
            <label for="reg-username">Nombre de Usuario:</label>
            <input type="text" id="reg-username" required maxlength="20">
        </div>
        <div>
            <label for="reg-email">Correo Electrónico:</label>
            <input type="email" id="reg-email" maxlength="25">
        </div>
        <div>
            <label for="reg-passwd">Contraseña:</label>
            <input type="password" id="reg-passwd" required maxlength="20">
        </div>
        <button type="submit" id="btn-enviar-registro">Registrarse</button>
        <button type="button" onclick="mostrarModal('modal-login')">Ir al Login</button>
    </form>
</div>
