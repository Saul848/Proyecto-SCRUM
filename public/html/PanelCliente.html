<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/mensajes.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Document</title>
</head>
<body>

  <!-- ============================= -->
    <!-- SECCIÓN DE MENSAJES (GENERAL) -->
    <!-- ============================= -->
    <div id="modal-mensajes" class="modal-class" style="display: none;">
        <div class="main-container-chat">
            
            <!-- Panel izquierdo: Canales y Contactos Directos -->
            <aside class="sidebar-mensajes">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="inputBuscarChat" placeholder="Buscar tema o mensaje...">
                </div>

                <!-- Canales -->
                <div>
                    <p class="menu-seccion">Canales</p>
                    <div class="lista-elementos" id="listaCanalesGeneral">
                        <!-- Se llenarán dinámicamente desde la BD -->
                    </div>
                </div>

                <!-- Contacto Directo -->
                <div>
                    <p class="menu-seccion">Contacto directo</p>
                    <div class="lista-elementos" id="listaContactosGeneral">
                        <!-- Se llenarán dinámicamente con los miembros del proyecto -->
                    </div>
                </div>
            </aside>

            <!-- Panel derecho: Área de Chat -->
            <section class="chat-area">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h3 id="tituloChatActual">Selecciona un canal o contacto</h3>
                        <span class="sub-info-chat" id="subInfoChat">Proyecto Activo</span>
                    </div>
                    
                    <!-- Botones superiores alineados a la derecha -->
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="btnIniciarConversacion" class="btn-iniciar-conversacion" style="padding: 6px 12px; font-size: 13px;">
                            💬 Iniciar conversación
                        </button>
                        <button class="btn-detalles" type="button">Ver detalles</button>
                    </div>
                </div>

                <!-- Historial de mensajes -->
                <div class="chat-mensajes" id="contenedorMensajesGeneral">
                    <div class="burbuja recibida" style="text-align: center; width: 100%; color: #64748b;">
                        Selecciona una conversación a la izquierda para empezar a chatear.
                    </div>
                </div>

                <!-- Caja inferior de entrada de texto (¡Aquí está de vuelta!) -->
                <div class="chat-input-box">
                    <input type="text" id="inputMensajeGeneral" placeholder="Escribe tu mensaje...">
                    <button id="btnEnviarMensajeGeneral" type="button">➤</button>
                </div>
            </section>

        </div>
    </div>

    <!-- Modal Oculto para Seleccionar Contacto a Iniciar -->
    <div id="modalNuevoChat" class="modal-chat-overlay" style="display: none;">
        <div class="modal-chat-content">
            <h3>Iniciar nueva conversación</h3>
            <p>Selecciona un miembro del proyecto:</p>
            <div id="listaContactosModal" class="lista-modal-contactos">
                <!-- Se llenará dinámicamente -->
            </div>
            <button id="btnCerrarModal" class="btn-cerrar-modal">Cancelar</button>
        </div>
    </div>

  <script src="../js/mensajes.js"></script>
</body>
</html>
