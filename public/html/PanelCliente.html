<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/panelCliente.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Document</title>
</head>
<body>

  <!-- CANAL DE COMUNICACIÓN CON EL EQUIPO -->
  <div id="modal-canal-equipo" class="modal-class" style="display: flex;">

    <header class="top-banner">
      <h1 class="banner-title">Canal de comunicación con el equipo</h1>
      <button type="button" class="btn-solicitar-reunion" id="btn-reunion">
        + Solicitar reunión rápida
      </button>
    </header>

    <section class="chat-workspace">
      
      <!-- LADO IZQUIERDO -->
      <aside class="chat-sidebar">
        <div class="search-box">
          <input type="text" id="input-buscar" placeholder="Buscar tema o mensaje..." />
          <span class="material-symbols-outlined icon-lupa">search</span>
        </div>

        <div class="section-group">
          <h3 class="group-title">Canales</h3>
          <ul class="channel-list">
            <li class="channel-item active">
              <span class="channel-name">#Dudas de requerimientos</span>
            </li>
            <li class="channel-item">
              <span class="channel-name">#Aprobaciones y entregas</span>
            </li>
            <li class="channel-item">
              <span class="channel-name">#General del proyecto</span>
            </li>
          </ul>
        </div>

        <div class="section-group">
          <h3 class="group-title">Contacto directo</h3>
          <div class="contact-item channel-item" id="contacto-facilitador">
            <span class="contact-name">Facilitador (Scrum Master)</span>
            <span class="contact-status"><span class="status-dot"></span> conectado</span>
          </div>
        </div>
      </aside>

      <!-- LADO DERECHO (CONVERSACIÓN) -->
      <div class="chat-conversation">
        
        <div class="channel-header">
          <div class="channel-info">
            <h2 id="canal-titulo">#Dudas de requerimientos</h2>
            <span class="channel-participants" id="canal-participantes">3 participantes</span>
          </div>
          <button type="button" class="btn-backlog" id="btn-ver-backlog">
            ver backlog asociado
          </button>
        </div>

        <!-- CONTENEDOR DE MENSAJES  -->
        <div class="messages-feed" id="messages-feed">
          <!-- Aquí se inyectan dinámicamente las burbujas de texto -->
        </div>

        <!-- Barra de texto fija abajo -->
        <footer class="chat-input-bar">
          <div class="input-container">
            <input type="text" id="mensaje-input" placeholder="Escribe tu mensaje..." autocomplete="off" />
            <div class="input-actions">
              <button type="button" class="btn-icon">
                <span class="material-symbols-outlined">mic</span>
              </button>
              <button type="button" class="btn-icon">
                <span class="material-symbols-outlined">attach_file</span>
              </button>
              <button type="button" class="btn-send" id="btn-enviar">
                <span class="material-symbols-outlined">send</span>
              </button>
            </div>
          </div>
        </footer>

      </div> 

    </section>
  </div>

  <script src="../js/MensajesCliente.js"></script>
</body>
</html>
