<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/panelPrincipal.css">
    <title>Document</title>
</head>
<body>
  <div id="contenedorMenuSuperior">
    <div id="contenedorFunciones">
      <button>Logo</button> <!--Provisional, cambiar por el logo con o sin función, segun lo que se requiera en el proyecto-->
      <h1>Gestor Scrum</h1>
      <button>Notificaciones</button>
      <button>Usuario</button>
      <button>Cerrar sesion</button>
    </div>
  </div>

  <div id="contenedor-principal">
    <div id="contenedorPanelLateral">
      <ul id="panelLateral">
        <li><button>Panel principal</button></li> <!--Debe ser abierto por defecto cuando se pasa el login-->
        <li>Mis proyectos</li>
        <li><button id="btn-miembros">Miembros</button></li>
        <li>Configuracion</li>
        <li>Mensajes</li>
      </ul>
    </div>
    
    <section id="contenedorAreaTrabajo">
      <a>Aqui va el modal segun la opcion del panel lateral</a>
      <!--Aqui dentro se aplicará cada modal, deberá quitarse el contenido de uno y ser reemplazado por otro al dar
      click en las opciones del menú lateral. No solo encimados unos sobre otros-->>

      <!--Aqui van los modales de cada uno-->

      <!--Modal para visualizar la lista de usuarios de la empresa-->
      <div id="modal-usuarios" class="modal-class">
        <h2>Lista de miembros de la organización</h2>
        <div id="contenedor-blanco">
          <div id="contenedor-azul">
            <h3>Miembros</h3>
            <div id="contenedor-usuarios">
            </div>
          </div>
        </div>
      </div>

    </section>
  </div>
  
  <!-- Modal para Crear Proyecto -->
  <div id="modalCrearProyecto" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="btnCerrarModal">&times;</span>
      <h2>Crear Nuevo Proyecto</h2>
      
      <form id="formCrearProyecto">
        <!-- Nombre del Proyecto -->
        <div class="form-group">
          <label for="nombreProyecto">Nombre del Proyecto *</label>
          <input type="text" id="nombreProyecto" required placeholder="Ej. Sistema de gestión SCRUM">
        </div>

        <!-- Descripción -->
        <div class="form-group">
          <label for="descripcionProyecto">Descripción</label>
          <textarea id="descripcionProyecto" rows="3" placeholder="Breve descripción del proyecto..."></textarea>
        </div>

        <!-- Invitaciones de Participantes -->
        <hr>
        <h3>Invitar Participantes</h3>
        <div class="form-group-inline">
          <input type="email" id="emailInvitado" placeholder="Correo del integrante">
          <select id="rolInvitado">
            <option value="Desarrollador">Desarrollador</option>
            <option value="Facilitador">Facilitador</option>
            <option value="Cliente">Cliente / Product Owner</option>
          </select>
          <button type="button" id="btnAgregarInvitado">+ Agregar</button>
        </div>

        <!-- Lista de invitados agregados temporalmente -->
        <ul id="listaInvitadosAgregados"></ul>

        <!-- Botones de Acción -->
        <div class="modal-actions">
          <button type="button" id="btnCancelar">Cancelar</button>
          <button type="submit" id="btnGuardarProyecto">Crear Proyecto</button>
        </div>
      </form>
    </div>
  </div>

  
  <script src="../js/usuarios.js"></script>
</body>
</html>
