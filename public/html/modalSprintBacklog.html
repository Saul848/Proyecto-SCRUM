<!--Modal 3 Tablero canvan-->
<div id="sprint-backlog" class="modal-class">
    <div id="objetivo-iteracion">
        <h2>Objetivo actual de la iteración</h2>
        <label for="">No. iteración #</label>
        <div id="objt-iteracion-box">Aqui va a ir el objetivo de la iteración actual</div>
    </div>

    <!-- Contenedor de duración con clase para control de rol -->
    <div id="duracion-iteracion">
        <h2>Duración</h2>
        <div id="fechas">
            <label for="">fecha inicio:</label>
            <label for="">fecha final:</label>
            <!-- Añadido ID o clase para ocultarlo -->
            <button id="boton-cambiar-duracion" class="ocultable-rol">cambiar duración</button>
        </div>
    </div>

    <!-- TABLERO KANVAN -->
    <div id="historias-sprint">
        <!-- Campo de búsqueda para la PB-24 -->
        <div class="kanban-search-container" style="margin-bottom: 15px;">
            <input type="text" id="inputBusquedaKanban" placeholder="🔍 Buscar historias por título o palabra clave..."
                style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;"
                autocomplete="off">
        </div>
        <div class="columnas-kanban">
            <h3>Por empezar</h3>
            <h3>En progreso</h3>
            <h3>En revisión</h3>
            <h3>Terminado</h3>
        </div>

        <!-- Contenedor general de las 4 columnas (Grid) -->
        <div id="tabla-historias">
            <div class="columna-kanban" data-estado="por-empezar"></div>
            <div class="columna-kanban" data-estado="en-progreso"></div>
            <div class="columna-kanban" data-estado="en-revision"></div>
            <div class="columna-kanban" data-estado="terminado"></div>
        </div>

        <label for="responsableHistoria">Responsable asignado:</label>
        <input type="text" readonly="readonly" id="responsableHistoria">
    </div>
    <!-- TERMINO tablero KANVAN -->

    <div id="botones-inferiores">
        <!-- Añadidos IDs para identificarlos fácilmente -->
        <button id="btn-ver-impedimentos" class="ocultable-rol">Ver impedimentos actuales</button>
        <button id="btn-ver-historial" class="ocultable-rol">Ver historial de cambios</button>
        
        <div id="progreso-sprint">
            <span>Progreso del sprint</span>
            <div class="barra-progreso">
                <div class="barra-progreso-relleno" style="width: 50%;"></div>
            </div>
            <span>50%</span>
        </div>
    </div>
</div>
