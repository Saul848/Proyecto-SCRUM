<!--Modal 3 Sprint Backlog-->
<div id="sprint-backlog" class="modal-class">
    <div id="objetivo-iteracion">
        <h2>Objetivo actual de la iteración</h2>
        <div class="selector-iteracion-wrapper">
            <label for="select-no-iteracion">No. iteración #</label>
            <select id="select-no-iteracion">
                <!-- Se llenará dinámicamente con JavaScript -->
                <option value="1">1</option>
            </select>
        </div>
        <div id="objt-iteracion-box">No hay información disponible para el objetivo de esta iteración.</div>
    </div>

    <!-- Contenedor de duración con clase para control de rol -->
    <div id="duracion-iteracion">
        <h2>Duración</h2>
        <div id="fechas">
            <label id="lbl-fecha-inicio">Fecha inicio: No disponible</label>
            <label id="lbl-fecha-final">Fecha final: No disponible</label>
            <!-- Añadido ID o clase para ocultarlo -->
            <button id="boton-cambiar-duracion" class="ocultable-rol">cambiar duración</button>
        </div>
    </div>

    <!-- TABLERO KANVAN -->
    <div id="historias-sprint">
        <!-- Campo de búsqueda para la PB-24 -->
        <div class="kanban-search-container" style="margin-bottom: 15px;">
            <input type="text" id="inputBusquedaKanban" placeholder="🔍 Buscar historias por título o palabra clave..."
                style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;"
                autocomplete="off">
        </div>
        <div class="columnas-kanban">
            <h3>Por empezar</h3>
            <h3>En progreso</h3>
            <h3>En revisión</h3>
            <h3>Terminado</h3>
        </div>

        <!-- Contenedor general de las 4 columnas (Grid) -->
        <div id="tabla-historias">
            <div class="columna-kanban" data-estado="por-empezar"></div>
            <div class="columna-kanban" data-estado="en-progreso"></div>
            <div class="columna-kanban" data-estado="en-revision"></div>
            <div class="columna-kanban" data-estado="terminado"></div>
        </div>

        <label for="responsableHistoria">Responsable asignado:</label>
        <input type="text" readonly="readonly" id="responsableHistoria">
    </div>
    <!-- TERMINO tablero KANVAN -->

    <!-- GESTIÓN DE IMPEDIMENTOS-->
    <div id="modal-gestion-impedimentos" class="modal-overlay"
        style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:10000; align-items:center; justify-content:center;">
        <div class="modal-content"
            style="max-width:980px; width:92%; max-height:90vh; overflow-y:auto; background:#fff; border-radius:10px; padding:20px;">

            <!-- Cabecera -->
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px; margin-bottom:15px;">
                <h3 id="titulo-modal-impedimentos" style="margin:0; font-size:18px; color:#1e293b;">Gestión de Impedimentos - Sprint Actual</h3>
                <button type="button" class="btn-cerrar-modal-impedimentos" onclick="cerrarModalImpedimentos()"
                        style="background:none; border:none; font-size:20px; cursor:pointer; color:#64748b;">&times;</button>
            </div>

            <!-- Filtros + registrar -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                <div class="filtros-impedimentos" style="display:flex; gap:8px;">
                    <button type="button" class="btn-filtro-imp activo" data-filtro="pendiente" style="padding:6px 12px; border-radius:6px; border:1px solid #cbd5e1; background:#f8fafc; cursor:pointer;">Pendientes</button>
                    <button type="button" class="btn-filtro-imp" data-filtro="resuelto" style="padding:6px 12px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; cursor:pointer;">Resueltos</button>
                </div>
                <button id="btn-registrar-impedimento" type="button" class="ocultable-rol-desarrollador"
                        style="display:none; background:#2563eb; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:500;">
                    + Registrar Nuevo Impedimento
                </button>
            </div>

            <!-- Cuerpo principal: Lista (izquierda) + Formulario (derecha) -->
            <div id="cuerpo-impedimentos-layout" style="display:flex; gap:18px; align-items:flex-start;">

                <!-- Lista (se llena con JS) -->
                <div id="lista-impedimentos-container"
                    style="flex:1; min-width:0; max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-right:5px;">
                </div>

                <!-- Formulario de registro (solo desarrollador, aparece a la derecha) -->
                <div id="form-impedimento"
                    style="display:none; flex:0 0 330px; border:1px solid #cbd5e1; border-radius:8px; padding:14px; background:#f8fafc; box-sizing:border-box;">
                    <h4 style="margin:0 0 10px; font-size:15px; color:#1e293b;">Nuevo Impedimento</h4>

                    <label for="imp-historia" style="font-size:13px; font-weight:bold; display:block;">Historia afectada</label>
                    <select id="imp-historia" style="width:100%; padding:6px; margin:4px 0 10px; border-radius:4px; border:1px solid #cbd5e1;"></select>

                    <label for="imp-descripcion" style="font-size:13px; font-weight:bold; display:block;">Descripción del problema</label>
                    <textarea id="imp-descripcion" rows="4" style="width:100%; padding:6px; margin:4px 0 12px; resize:vertical; border-radius:4px; border:1px solid #cbd5e1; box-sizing:border-box;"></textarea>

                    <div style="display:flex; gap:8px; justify-content:flex-end;">
                        <button type="button" id="btn-cancelar-impedimento" style="background:#e2e8f0; color:#334155; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Cancelar</button>
                        <button type="button" id="btn-guardar-impedimento" style="background:#2563eb; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Guardar</button>
                    </div>
                </div>

            </div>

            <div style="text-align:right; margin-top:20px; border-top:1px solid #e2e8f0; padding-top:12px;">
                <button type="button" onclick="cerrarModalImpedimentos()" style="background:#e2e8f0; color:#334155; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="botones-inferiores">
        <!-- Añadidos IDs para identificarlos fácilmente -->
        <button id="btn-ver-impedimentos" class="ocultable-impedimentos" style="display:none;">Ver impedimentos actuales</button>
        <button id="btn-ver-historial" class="ocultable-rol">Ver historial de cambios</button>
    
        <div id="progreso-sprint">
            <span>Progreso del sprint</span>
            <div class="barra-progreso">
                <!-- ID añadido para que JS pueda cambiar el ancho -->
                <div id="barra-progreso-relleno" class="barra-progreso-relleno" style="width: 0%;"></div>
            </div>
            <!-- ID añadido para que JS actualice el texto numérico -->
            <span id="texto-porcentaje-progreso">0%</span>
        </div>
    </div>
</div>
